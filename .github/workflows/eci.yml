name: Leer El Corte Inglés

on:
  schedule:
    - cron: '0 2 * * 0'   # domingos de madrugada
  workflow_dispatch:
    inputs:
      sonda:
        description: 'Solo prueba (1 categoría, 2 páginas)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  eci:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml
      - name: Leer supermercado
        run: python3 scripts/scrape_eci.py ${{ inputs.sonda && '--probe' || '' }}
      - name: Subir datos y regenerar productos.js
        if: ${{ !inputs.sonda }}
        run: |
          python3 scripts/actualizar_datos.py
          git config user.name "cestuki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add datos productos.js
          git diff --cached --quiet && exit 0
          n=$(grep -o "cestuki-v[0-9]*" sw.js | head -1 | grep -o "[0-9]*$")
          sed -i "s/cestuki-v$n/cestuki-v$((n+1))/" sw.js; git add sw.js
          git commit -m "El Corte Inglés actualizado $(date -u +%F)"
          git pull --rebase -q origin main
          git push
